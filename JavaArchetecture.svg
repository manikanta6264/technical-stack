<svg width="3000" height="1800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box {
      fill: #1E88E5;
      stroke: #0D47A1;
      stroke-width: 3;
      rx: 15;
      ry: 15;
    }
    .text {
      fill: white;
      font-family: 'Roboto', sans-serif;
      font-size: 50px;
    }
    .arrow {
      stroke: #0D47A1;
      stroke-width: 5;
      marker-end: url(#arrowhead);
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="20" markerHeight="20" 
            refX="10" refY="5" orient="auto" fill="#0D47A1">
      <path d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="100" y="100" class="text" font-size="80px">Java Architecture & Memory</text>

  <!-- JVM vs JRE vs JDK -->
  <rect x="200" y="200" width="1000" height="200" class="box"/>
  <text x="250" y="330" class="text">JVM vs JRE vs JDK</text>

  <!-- Details box -->
  <rect x="1400" y="200" width="1400" height="400" class="box" fill="#42A5F5"/>
  <text x="1450" y="300" class="text" font-size="40px">
    JVM: runs bytecode, platform-independent
  </text>
  <text x="1450" y="370" class="text" font-size="40px">
    JRE: JVM + libraries
  </text>
  <text x="1450" y="440" class="text" font-size="40px">
    JDK: JRE + tools (compilers, debuggers)
  </text>

  <!-- Arrow -->
  <line x1="1200" y1="300" x2="1400" y2="300" class="arrow"/>

  <!-- Memory Areas -->
  <rect x="200" y="600" width="1000" height="200" class="box"/>
  <text x="250" y="730" class="text">Memory Areas</text>

  <rect x="1400" y="600" width="1400" height="400" class="box" fill="#42A5F5"/>
  <text x="1450" y="700" class="text" font-size="40px">
    Heap: stores objects
  </text>
  <text x="1450" y="770" class="text" font-size="40px">
    Stack: method calls, local vars
  </text>
  <text x="1450" y="840" class="text" font-size="40px">
    Method Area / Metaspace: class metadata
  </text>
  <text x="1450" y="910" class="text" font-size="40px">
    Native Method Stack: native code support
  </text>

  <line x1="1200" y1="700" x2="1400" y2="700" class="arrow"/>

  <!-- Garbage Collection -->
  <rect x="200" y="1100" width="1000" height="200" class="box"/>
  <text x="250" y="1230" class="text">Garbage Collection</text>

  <rect x="1400" y="1100" width="1400" height="400" class="box" fill="#42A5F5"/>
  <text x="1450" y="1200" class="text" font-size="40px">
    Automatic memory cleanup
  </text>
  <text x="1450" y="1270" class="text" font-size="40px">
    finalize() called before GC
  </text>
  <text x="1450" y="1340" class="text" font-size="40px">
    Algorithms: Mark-Sweep, Mark-Compact, Generational
  </text>
  <text x="1450" y="1410" class="text" font-size="40px">
    Memory leaks: objects still referenced
  </text>

  <line x1="1200" y1="1200" x2="1400" y2="1200" class="arrow"/>

</svg>
